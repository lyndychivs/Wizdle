version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
    - package-ecosystem: "dotnet-sdk"
      directory: "/"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
    - package-ecosystem: "nuget"
      directory: "/"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
      # A package goes into the first group whose patterns match, so order matters.
      groups:
          analyzers:
              patterns:
                - "StyleCop.Analyzers"
                - "Meziantou.Analyzer"
                - "Moq.Analyzers"
                - "NUnit.Analyzers"
          testing:
              patterns:
                - "NUnit*"
                - "Moq*"
                - "bunit"
                - "Reqnroll*"
                - "Testcontainers*"
                - "dotnet-stryker"
                - "Deque.AxeCore.Playwright"
                - "Microsoft.Playwright*"
                - "Microsoft.Testing.*"
                - "Microsoft.AspNetCore.Mvc.Testing"
                - "Microsoft.Extensions.Diagnostics.Testing"
          opentelemetry:
              patterns:
                - "OpenTelemetry*"
          serilog:
              patterns:
                - "Serilog*"
          microsoft:
              patterns:
                - "Microsoft.*"
                - "Aspire.*"
    - package-ecosystem: "docker"
      directory: "/src/Wizdle.Api"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
    - package-ecosystem: "docker"
      directory: "/src/Wizdle.Discord"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
    - package-ecosystem: "docker"
      directory: "/src/Wizdle.Web"
      assignees:
        - "lyndychivs"
      schedule:
          interval: "weekly"
          day: "sunday"
          time: "09:00"
      cooldown:
          default-days: 3
