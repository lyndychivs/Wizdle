name: Mutation Testing with Stryker.NET
run-name: Mutation Testing with Stryker.NET
permissions:
    contents: read
on:
    push:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * SUN"
jobs:
    mutation_testing:
        name: Mutation Testing
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Build Stryker Arguments
              id: stryker_args
              run: |
                  ARGS="--reporter progress --reporter html --reporter json --version ${GITHUB_REF_NAME}"
                  if [ -n "$(printf '%s' "${STRYKER_DASHBOARD_API_KEY}" | tr -d '[:space:]')" ]; then
                      ARGS="${ARGS} --reporter dashboard"
                  else
                      echo "::notice::Stryker dashboard API key is null, empty or whitespace; skipping dashboard reporter."
                  fi
                  echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"

            - name: Run Stryker.NET
              uses: lyndychivs/dotnet-stryker-action@v2
              with:
                  configFile: "tests/unit/Wizdle.Unit.Tests/stryker-config.json"
                  strykerArgs: ${{ steps.stryker_args.outputs.args }}
