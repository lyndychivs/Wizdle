name: Deploy
run-name: "Deploy: ${{ github.ref_name }}"
permissions:
    contents: read
on:
    workflow_dispatch:
    workflow_call:
jobs:
    deploy:
        name: Deploy
        runs-on: self-hosted
        timeout-minutes: 15
        environment: production
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Write .env
              run: |
                  cat <<EOF > .env
                  WIZDLE_API_PORT=6060
                  WIZDLE_WEB_PORT=6061
                  ASPIRE_API_PORT=18888
                  ASPIRE_OTLP_PORT=18889

                  DASHBOARD_OTLP_API_KEY=${{ secrets.DASHBOARD_OTLP_API_KEY }}
                  DASHBOARD_FRONTEND_AUTHMODE=${{ vars.DASHBOARD_FRONTEND_AUTHMODE }}
                  DASHBOARD_FRONTEND_BROWSERTOKEN=${{ secrets.DASHBOARD_FRONTEND_BROWSERTOKEN }}

                  DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
                  DISCORD_PUBLIC_KEY=${{ secrets.DISCORD_PUBLIC_KEY }}
                  EOF

            - name: Deploy
              run: docker compose -f docker-compose.yaml -f docker-compose.production.yml up -d --build
