name: Deploy
run-name: "Deploy: ${{ github.ref_name }}"
permissions:
    contents: read
on:
    workflow_dispatch:
    workflow_call:
concurrency:
    group: deploy-production
    cancel-in-progress: false
jobs:
    deploy:
        name: Deploy
        runs-on: self-hosted
        timeout-minutes: 15
        environment: production
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Deploy
              run: docker compose -f docker-compose.yaml -f docker-compose.production.yml up -d --build
              env:
                  WIZDLE_API_PORT: ${{ vars.WIZDLE_API_PORT }}
                  WIZDLE_WEB_PORT: ${{ vars.WIZDLE_WEB_PORT }}
                  ASPIRE_API_PORT: ${{ vars.ASPIRE_API_PORT }}
                  ASPIRE_OTLP_PORT: ${{ vars.ASPIRE_OTLP_PORT }}
                  DASHBOARD_OTLP_API_KEY: ${{ secrets.DASHBOARD_OTLP_API_KEY }}
                  DASHBOARD_FRONTEND_AUTHMODE: ${{ vars.DASHBOARD_FRONTEND_AUTHMODE }}
                  DASHBOARD_FRONTEND_BROWSERTOKEN: ${{ secrets.DASHBOARD_FRONTEND_BROWSERTOKEN }}
                  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
                  DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
